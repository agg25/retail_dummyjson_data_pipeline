[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retail-dummyjson-data-pipeline"
version = "0.1.0"
description = "Retail/e-commerce data pipeline: ingest the DummyJSON API into BigQuery and transform it with dbt."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.27",
    "polars>=1.0",
    "pyarrow>=16.0",
    "python-dotenv>=1.0",
    "dbt-bigquery>=1.8",
]

[project.scripts]
retail-ingest = "retail_dummyjson_pipeline.ingest:main"
retail-load-bq = "retail_dummyjson_pipeline.load_bigquery:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/retail_dummyjson_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
